name: Build Studio Taraneh APK & AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Gradle Wrapper Files
        run: |
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradlew -O gradlew
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradlew.bat -O gradlew.bat
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          echo "Gradle Wrapper files downloaded successfully"

      - name: Verify Files
        run: |
          ls -la gradlew
          ls -la gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
