name: Android Build

on:
  push:
    branches: [main, tapsell-vip-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env from GitHub Secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          BAZAAR_RSA_PUBLIC_KEY=${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          TAPSELL_APP_KEY=${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_REWARDED_ZONE=${{ secrets.TAPSELL_REWARDED_ZONE }}
          TAPSELL_STANDARD_BANNER_ZONE=${{ secrets.TAPSELL_STANDARD_BANNER_ZONE }}
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-tarane-debug-apk
          path: app/build/outputs/apk/debug/*.apk
