name: Build Studio Taraneh APK, AAB & CafeBazaar BIN

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle Wrapper Files
        run: |
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradlew -O gradlew
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradlew.bat -O gradlew.bat
          wget -q https://raw.githubusercontent.com/android/architecture-samples/main/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # -----------------------------------------
      # Restore Release Keystore
      # -----------------------------------------
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks

      # -----------------------------------------
      # Configure Gradle Release Signing
      # -----------------------------------------
      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          signing = '''
            signingConfigs {
              create("release") {
                storeFile = rootProject.file("release-key.jks")
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
              }
            }
          '''

          text = text.replace(
              '  // ✅ signingConfigs حذف شد — Debug خودکار امضا می‌شود، Release بدون امضا Build می‌شود',
              signing
          )

          text = text.replace(
              '      // ✅ signingConfig حذف شد — Release بدون امضا تولید می‌شود',
              '      signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(text)
          PY

      # -----------------------------------------
      # Build
      # -----------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      # -----------------------------------------
      # Download CafeBazaar Bundle Signer
      # -----------------------------------------
      - name: Download CafeBazaar Bundle Signer
        run: |
          wget -q https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundlesigner-0.1.13.jar \
            -O bundlesigner.jar

      # -----------------------------------------
      # Generate CafeBazaar BIN
      # -----------------------------------------
      - name: Generate CafeBazaar BIN
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p cafebazaar-bin

          java -jar bundlesigner.jar genbin \
            -v \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --bin cafebazaar-bin \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks release-key.jks \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD"

      # -----------------------------------------
      # Upload APK
      # -----------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # -----------------------------------------
      # Upload AAB
      # -----------------------------------------
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # -----------------------------------------
      # Upload BIN
      # -----------------------------------------
      - name: Upload CafeBazaar BIN
        uses: actions/upload-artifact@v4
        with:
          name: studio-taraneh-cafebazaar-bin
          path: cafebazaar-bin/*.bin
          retention-days: 30
