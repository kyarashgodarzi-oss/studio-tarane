name: Android Build

on:
  push:
    branches: [main, tapsell-vip-integration, feature/vip-tapsell-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          printf 'GEMINI_API_KEY=%s\n' "${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" > .env
          printf 'BAZAAR_RSA_PUBLIC_KEY=%s\n' "${BAZAAR_RSA_PUBLIC_KEY:-YOUR_CAFE_BAZAAR_RSA_PUBLIC_KEY}" >> .env
          printf 'TAPSELL_APP_KEY=gpddcgcgnthsorrgsomlesospgkmardetodjogicakngbrdetccegepaonlonfbpeqboom\n' >> .env
          printf 'TAPSELL_REWARDED_ZONE=6abaebb00a772b2b3f29c16b\n' >> .env
          printf 'TAPSELL_STANDARD_BANNER_ZONE=6abaec923c315037c8c55b1c\n' >> .env
          printf 'TAPSELL_INSTANT_ZONE=6abaecc83c315037c8c55b1d\n' >> .env
          printf 'TAPSELL_NATIVE_VIDEO_ZONE=6abaec4169b53c3fd930618e\n' >> .env
          printf 'TAPSELL_PRE_ROLL_ZONE=6abaec013c315037c8c55b1b\n' >> .env

      - name: Build debug APK and AAB
        run: |
          gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-tarane-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: studio-tarane-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
